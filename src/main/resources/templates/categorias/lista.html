<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorias | BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}" href="../../static/css/categorias.css">
</head>
<body>
<h1>Categorias da biblioteca</h1>
<p class="barra">
    <a class="botao" th:href="@{/categorias/nova}">Nova categoria</a>
</p>


<table>
    <caption>Categorias cadastradas no BiblioTec</caption>

    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Nome</th>
            <th scope="col">Descrição</th>
            <th scope="col">Ações</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="categoria : ${categorias}">
            <td th:text="${categoria.id}">1</td>
            <td th:text="${categoria.nome}">Nome de exemplo</td>
            <td th:text="${categoria.descricao}">Descrição de exemplo</td>
            <td class="acoes">
                <a class="botao botao-pequeno" th:href="@{/categorias/{id}/editar(id=${categoria.id})}">Editar</a>
                <form class="excluir" method="post"
                      th:action="@{/categorias/{id}/excluir(id=${categoria.id})}"
                      th:data-nome="${categoria.nome}">
                    <button type="submit" class="botao botao-pequeno botao-perigo">
                        Excluir
                    </button>
                </form>
            </td>
        </tr>
    </tbody>
</table>
<script>
    document.querySelectorAll('form.excluir').forEach(function (formulario) {
        formulario.addEventListener('submit', function (evento) {
            var nome = formulario.dataset.nome;
            if (!confirm('Excluir a categoria "' + nome + '"?')) {
                evento.preventDefault();
            }
        });
    });
</script>
</body>
</html>
