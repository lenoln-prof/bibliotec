<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categoria | BiblioTec</title>
    <link rel="stylesheet" th:href="@{/css/categorias.css}"
          href="../../static/css/categorias.css">
</head>
<body>
<h1 th:text="${categoria.id == null ? 'Nova categoria' : 'Editar categoria'}">Nova categoria</h1>

<form class="formulario" th:action="@{/categorias}"
      th:object="${categoria}" method="post">
    <div th:if="${#fields.hasAnyErrors()}">
        <ul style="margin-left: -20px;" >
            <li class="erro" th:each="erro : ${#fields.allErrors()}" th:text="${erro}"></li>
        </ul>
    </div>
    <input type="hidden" th:field="*{id}">

    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" th:field="*{nome}" th:errorclass="campo-erro">

    <label for="descricao">Descrição</label>
    <input type="text" id="descricao" name="descricao" th:field="*{descricao}" th:errorclass="campo-erro">

    <div class="acoes">
        <button type="submit" class="botao">Salvar</button>
        <a class="botao botao-secundario" th:href="@{/categorias}">Cancelar</a>
    </div>
</form>
</body>
</html>
